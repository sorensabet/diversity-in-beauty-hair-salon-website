name: Deploy to GitHub Pages

# Publishes the static site whenever changes land on the repository's
# default branch.
#
# Note: `on.push.branches` can't reference the default branch by name, so this
# listens to every branch push and the job below filters down to the default
# branch. That keeps deploys working whatever the branch is called (main,
# master, or anything else) instead of silently never running.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    # Only the default branch gets published; pushes to feature branches are ignored.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repo is the site (no build step needed).
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
