<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Diversity in Beauty Hair Salon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a2f4d"/>
      <stop offset="1" stop-color="#2b2530"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="60%">
      <stop offset="0" stop-color="#c9a35b" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#c9a35b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <text x="600" y="300" text-anchor="middle" font-family="Georgia, serif" font-size="64" fill="#ffffff">Diversity in Beauty</text>
  <text x="600" y="360" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#c9a35b">Hair Salon — Kitchener, ON</text>
